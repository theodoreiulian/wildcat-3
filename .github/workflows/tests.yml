name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      # Parse the desktop shell and the panel it hosts; Electron itself is not installed in CI.
      - run: node --check desktop/main.js && node --check desktop/preload.js && node --check src/wildcat3/static/app.js
